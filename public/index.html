<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Radioaktivität-Monitor (Live)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map { margin: 0; padding: 0; height: 100%; background: #0a0a0a; }
        .info-panel {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: rgba(0, 0, 0, 0.85); color: white; padding: 15px;
            border-radius: 8px; border: 1px solid #444; font-family: sans-serif; width: 220px;
        }
        .leaflet-tooltip-radiation {
            background: #1a1a1a !important; color: white !important;
            border: 1px solid #ff4d4d !important; padding: 10px; font-size: 0.9rem;
        }
        .legend { font-size: 0.75rem; margin-top: 10px; color: #aaa; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="info-panel">
        <h3 style="margin:0; color:#ff4d4d;">☢️ ODL-Echtzeit</h3>
        <p id="status" style="font-size:0.8rem; margin:5px 0;">Lade Stationen...</p>
        <div class="legend">
            <span class="dot" style="background:#4caf50;"></span> Normal (&lt; 0.15)<br>
            <span class="dot" style="background:#ffa500;"></span> Erhöht (0.15 - 0.20)<br>
            <span class="dot" style="background:#ff4d4d;"></span> Warnung (&gt; 0.20)
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([51.16, 10.45], 6);
        const stationLayer = L.layerGroup().addTo(map);

        // Funktion zum manuellen Versenden eines Messpunkts via MQTT / MeshCom
        async function sendStationToMqtt(station) {
            const statusEl = document.getElementById('status');
            try {
                console.log("📡 Sende Station an MQTT...", station.n);
                if (statusEl) statusEl.innerText = `📡 Sende: ${station.n || 'unbekannt'}...`;

                const res = await fetch('/api/publish-station', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(station)
                });
                const result = await res.json();

                if (result.ok) {
                    console.log(`✅ Ausgesendet: ${station.n}`);
                    if (statusEl) {
                        statusEl.innerText = `✅ Gesendet: ${station.n}`;
                        setTimeout(() => {
                            statusEl.innerText = `✅ ${stationLayer.getLayers().length} Messstellen aktiv`;
                        }, 4000);
                    }
                } else {
                    console.warn(`⚠️ Fehler beim Senden:`, result.error);
                    if (statusEl) statusEl.innerText = `⚠️ Fehler: ${result.error}`;
                }
            } catch (err) {
                console.error("❌ Netzwerkfehler beim Senden:", err);
                if (statusEl) statusEl.innerText = "❌ Sende-Fehler!";
            }
        }

        // 1. TileLayer mit API-Key aus dem Backend initialisieren
        async function initTileLayer() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                
                const tileUrl = config.cartoApiKey 
                    ? `https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=${encodeURIComponent(config.cartoApiKey)}`
                    : 'https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png';

                L.tileLayer(tileUrl, {
                    attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; xBfS Opendata'
                }).addTo(map);
            } catch (err) {
                console.error("TileLayer-Konfiguration fehlgeschlagen, nutze Fallback-URL:", err);
                L.tileLayer('https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png', {
                    attribution: '&copy; CARTO &copy; BfS Opendata'
                }).addTo(map);
            }
        }

        // 2. Strahlungsdaten abrufen und Marker setzen
        async function updateData() {
            try {
                const res = await fetch('/api/radiation');
                const data = await res.json();
                
                stationLayer.clearLayers();
                data.forEach(s => {
                    let color = "#4caf50";
                    if (s.v > 0.15) color = "#ffa500";
                    if (s.v > 0.20) color = "#ff4d4d";

                    const marker = L.circleMarker([s.lt, s.ln], {
                        radius: 5,
                        fillColor: color,
                        color: "#fff",
                        weight: 0.5,
                        fillOpacity: 0.8
                    });

                    // Hover Tooltip mit Fallback-Prüfung gegen undefined/null
                    marker.bindTooltip(`
                        <b>${s.n || 'Unbekannte Station'}</b> (${s.plz || '-'})<br>
                        <span style="font-size:1.1rem; color:${color};"><b>${(s.v ?? 0).toFixed(3)} µSv/h</b></span><hr style="border:0; border-top:1px solid #444;">
                        Boden: ${(s.v_ter ?? 0).toFixed(3)} | Kosmisch: ${(s.v_cos ?? 0).toFixed(3)}<br>
                        Höhe: ${s.h ?? '-'}m | Status: ${s.st || 'unbekannt'}<br>
                        <span style="font-size:0.75rem; color:#aaa;">(Klick = MQTT / Funk senden)</span>
                    `, { sticky: true, className: 'leaflet-tooltip-radiation' });

                    // ---> VARIANTE B: Bei Klick sofort per MQTT / Funk aussenden <---
                    marker.on('click', () => {
                        sendStationToMqtt(s);
                    });

                    marker.addTo(stationLayer);
                });
                document.getElementById('status').innerText = `✅ ${data.length} Messstellen aktiv`;
            } catch (err) {
                console.error("Fehler beim Laden der Messdaten:", err);
                document.getElementById('status').innerText = "❌ Verbindungsfehler!";
            }
        }

        // Initiale Aufrufe
        initTileLayer();
        updateData();
        setInterval(updateData, 600000); // 10 Minuten Intervall
    </script>
</body>
</html>
